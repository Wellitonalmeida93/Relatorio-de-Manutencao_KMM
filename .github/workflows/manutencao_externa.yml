name: Robô KMM - Manutenção Externa

on:
  schedule:
    - cron: '0 * * * *'  # Executa de hora em hora
  workflow_dispatch:     # Permite execução manual (botão "Run workflow")

jobs:
  executar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium
        run: playwright install chromium

      - name: Executar script
        env:
          KMM_USER: ${{ secrets.KMM_USER }}
          KMM_PASS: ${{ secrets.KMM_PASS }}
        run: python teste_manutencao_externa.py
